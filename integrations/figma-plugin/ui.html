<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font: 12px/1.45 Inter, system-ui, sans-serif; color: #171717; background: #fff; }
    h1 { margin: 0 0 5px; font-size: 15px; }
    p { margin: 0 0 14px; color: #686868; }
    .drop { border: 1px dashed #b9b9b9; border-radius: 10px; padding: 18px; text-align: center; background: #fafafa; }
    .drop.drag { border-color: #111; background: #f3f3f3; }
    input { width: 100%; }
    button { margin-top: 12px; width: 100%; height: 34px; border: 0; border-radius: 8px; background: #111; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .35; cursor: default; }
    #meta { margin-top: 12px; color: #555; white-space: pre-wrap; }
    #error { margin-top: 10px; color: #b42318; white-space: pre-wrap; }
    #warnings { margin-top: 10px; max-height: 120px; overflow: auto; color: #8a4b08; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Pitch Monumentum Importer</h1>
  <p>Import a self-contained <code>.pitch-figma.json</code> bundle into native Figma or Figma Slides objects.</p>
  <div id="drop" class="drop">
    <input id="file" type="file" accept=".json,.pitch-figma.json,application/json" />
  </div>
  <div id="meta">Choose an export bundle.</div>
  <div id="warnings"></div>
  <div id="error"></div>
  <button id="import" disabled>Import native deck</button>

  <script>
    let bundle = null;
    const fileInput = document.getElementById('file');
    const drop = document.getElementById('drop');
    const importButton = document.getElementById('import');
    const meta = document.getElementById('meta');
    const error = document.getElementById('error');
    const warnings = document.getElementById('warnings');

    function setBundle(next) {
      if (!next || next.kind !== 'pitch-figma-bridge' || next.schemaVersion !== '0.1' || !next.deck) {
        throw new Error('This file is not a Pitch Monumentum Figma bridge bundle.');
      }
      bundle = next;
      const slides = next.deck.slides?.length || 0;
      const assets = Object.keys(next.assets || {}).length;
      meta.textContent = `${next.deck.title || 'Untitled'}\n${slides} slide(s) · ${assets} embedded asset(s)`;
      warnings.textContent = (next.warnings || []).length
        ? `Pitch export warnings:\n${next.warnings.map(w => `• ${w.elementId}: ${w.message}`).join('\n')}`
        : '';
      importButton.disabled = false;
      error.textContent = '';
    }

    async function readFile(file) {
      try {
        const text = await file.text();
        setBundle(JSON.parse(text));
      } catch (err) {
        bundle = null;
        importButton.disabled = true;
        error.textContent = err instanceof Error ? err.message : String(err);
      }
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      if (file) readFile(file);
    });

    for (const event of ['dragenter', 'dragover']) {
      drop.addEventListener(event, e => { e.preventDefault(); drop.classList.add('drag'); });
    }
    for (const event of ['dragleave', 'drop']) {
      drop.addEventListener(event, e => { e.preventDefault(); drop.classList.remove('drag'); });
    }
    drop.addEventListener('drop', e => {
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) readFile(file);
    });

    importButton.addEventListener('click', () => {
      if (!bundle) return;
      importButton.disabled = true;
      meta.textContent += '\nImporting…';
      parent.postMessage({ pluginMessage: { type: 'IMPORT_PITCH_BUNDLE', bundle } }, '*');
    });

    onmessage = event => {
      const message = event.data && event.data.pluginMessage;
      if (!message) return;
      if (message.type === 'IMPORT_DONE') {
        importButton.disabled = false;
        meta.textContent = `${bundle.deck.title || 'Untitled'}\nImported ${message.slides} slide(s), ${message.elements} native object(s).`;
        warnings.textContent = message.warnings?.length ? `Importer warnings:\n${message.warnings.map(w => `• ${w}`).join('\n')}` : warnings.textContent;
      }
      if (message.type === 'IMPORT_ERROR') {
        importButton.disabled = false;
        error.textContent = message.message || 'Import failed.';
      }
    };
  </script>
</body>
</html>
